# tempsnap.cc — the public door to agentshare.
#
# The zone is proxied through Cloudflare with SSL mode "Full", so Cloudflare
# terminates public TLS and speaks HTTPS to this origin on 443. The certificate
# here is self-signed and exists only for that hop: Cloudflare does not verify
# it in Full mode (only in Full (strict)). `update-cloudflare-ips.sh` keeps
# nginx's idea of the client address honest.
#
# Install to /etc/nginx/sites-available/tempsnap.cc and symlink into
# sites-enabled. Also needs /etc/nginx/snippets/agentshare-proxy.conf and
# /etc/nginx/conf.d/cloudflare-realip.conf.

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name tempsnap.cc;

    # Kept so that a real certificate can be issued later without downtime:
    # certbot --webroot -w /var/www/certbot would place its challenge here.
    # Always reachable regardless of what agentshare is doing.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/agentshare-proxy.conf;
    }
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name tempsnap.cc;

    ssl_certificate     /etc/nginx/ssl/tempsnap.cc.crt;
    ssl_certificate_key /etc/nginx/ssl/tempsnap.cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/agentshare-proxy.conf;
    }
}
