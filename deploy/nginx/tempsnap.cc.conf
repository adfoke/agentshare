# tempsnap.cc — the public door to agentshare.
#
# The zone is proxied through Cloudflare with SSL mode "Full", so Cloudflare
# terminates public TLS and speaks HTTPS to this origin on 443. The certificate
# here is self-signed and exists only for that hop: Cloudflare does not verify
# it in Full mode (only in Full (strict)). `update-cloudflare-ips.sh` keeps
# nginx's idea of the client address honest.
#
# Install to /etc/nginx/sites-available/tempsnap.cc and symlink into
# sites-enabled. Also needs, as /etc/nginx/snippets/:
#   agentshare-proxy.conf   the proxy settings (see that file for why each one)
#   acme-challenge.conf     the certificate challenge directory
# and /etc/nginx/conf.d/cloudflare-realip.conf from update-cloudflare-ips.sh.

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name tempsnap.cc;

    # So that a real certificate can be issued later without downtime:
    # certbot --webroot -w /var/www/certbot places its challenge here.
    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/agentshare-proxy.conf;
    }
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name tempsnap.cc;

    # Only Cloudflare may reach this name, even though the port itself is now
    # open to the world for dl.tempsnap.cc. See that file for the reasoning.
    include /etc/nginx/snippets/cloudflare-guard.conf;

    ssl_certificate     /etc/nginx/ssl/tempsnap.cc.crt;
    ssl_certificate_key /etc/nginx/ssl/tempsnap.cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Same challenge directory as the :80 block above. It is here so that a
    # challenge arriving over HTTPS is served rather than answered by the API.
    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/agentshare-proxy.conf;
    }
}
