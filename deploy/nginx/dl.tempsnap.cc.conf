# dl.tempsnap.cc — the direct address, for transfers the CDN will not carry.
#
# In DNS this name is unproxied ("grey cloud"), so it resolves straight to this
# server and clients reach it with no CDN in the path. That is the entire point:
# a proxied address refuses request bodies above a fixed size, and this address
# exists so that ceiling stops applying.
#
# Three things follow from being direct, and all three are handled here or in
# the file that manages the firewall:
#
#   1. The certificate has to be real. With the proxied name the public TLS is
#      terminated by the CDN and the origin certificate is never seen by a
#      client (which is why the proxied name can get away with a self-signed
#      one). Here every client sees this certificate, so it comes from Let's
#      Encrypt and renews itself.
#   2. Port 443 on this machine has to accept connections from anywhere, since
#      the clients are no longer all Cloudflare. That is what makes the guard at
#      the top of tempsnap.cc.conf necessary — it keeps the proxied name
#      reachable only through Cloudflare even though the port is now wide open.
#   3. http is redirected rather than proxied. On the proxied name an http
#      visitor is already encrypted between themselves and the CDN, so proxying
#      their request along is defensible; here there is no such hop, and an API
#      token sent over http would be readable by anyone on the path.

server {
    listen      80;
    listen      [::]:80;
    server_name dl.tempsnap.cc;

    # Certificate challenges arrive in the clear, so this has to be reachable
    # before the redirect below sends everything else to https.
    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name dl.tempsnap.cc;

    ssl_certificate     /etc/letsencrypt/live/dl.tempsnap.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dl.tempsnap.cc/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Deliberately not the default_server: a request for the bare IP address, or
    # for any name nobody has configured, lands on the proxied vhost and is
    # refused there unless it came through Cloudflare. Reaching this vhost
    # requires asking for this name.

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/agentshare-proxy.conf;
    }
}
