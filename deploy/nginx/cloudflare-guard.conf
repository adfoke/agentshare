# Refuse direct requests to the proxied name. Included at the top of the
# tempsnap.cc :443 server block.
#
# Why this exists: the machine also serves a direct (unproxied) address, so port
# 443 now accepts connections from anywhere rather than only from Cloudflare.
# Without this guard, anyone who learns the origin address could send
# `Host: tempsnap.cc` straight to the server and skip Cloudflare entirely — its
# WAF, its bot rules, its rate limiting, and the request-body cap that the
# direct address exists to get around.
#
# The check must look at $realip_remote_addr, not $remote_addr. The realip
# module runs in the post-read phase, before the access phase, so by the time
# anything like `allow`/`deny` evaluates, $remote_addr has already been
# rewritten to the visiting client — which is never a Cloudflare address. A list
# of Cloudflare ranges tested against $remote_addr would refuse everything.
# $realip_remote_addr is the peer the connection was actually accepted from,
# which is the thing worth testing.
#
# $agentshare_cf_peer is defined in /etc/nginx/conf.d/cloudflare-geo.conf, which
# update-cloudflare-ips.sh generates from Cloudflare's published ranges.
#
# Failure mode to recognise: if this ever starts refusing legitimate traffic,
# Cloudflare has probably added a range. Re-run update-cloudflare-ips.sh — the
# same fix as for the connection timeouts the firewall would otherwise produce,
# with the response code being the only difference.

if ($agentshare_cf_peer = 0) {
    return 403;
}
