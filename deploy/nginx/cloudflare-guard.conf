# Refuse direct requests to the proxied name.
#
# When it is needed at all, and that it protects a *port*, not a name:
#
#   It only exists because the port is not "Cloudflare only". Two things cause
#   that, and they usually co-occur: a direct (unproxied) address exists, so the
#   port must be open to the world; or the firewall simply never restricted it
#   to Cloudflare's ranges. Either way, anyone who learns the origin address can
#   send `Host: <your domain>` straight at the server and skip Cloudflare
#   entirely — its WAF, its bot rules, its rate limiting, and the request-body
#   cap that the direct address exists to get around.
#
#   ⚠️ It guards the block it is included in. If the name is served on a second
#   port, or on a second vhost, it has to be included there too — and a missing
#   one is invisible: everything looks healthy while one port is wide open.
#   (Measured on tempsnap.cc: :443 was guarded, :80 was not, and because that
#   :80 block was the default_server, a plain `http://<origin-ip>/` — no Host
#   header at all — was forwarded to agentshare.)
#
# Where to put it depends on how the vhosts are shaped:
#
#   * Two separate blocks (:80 and :443) — :443 at server level, before
#     `location /`; :80 inside `location /`. The asymmetry is deliberate: a
#     server level `if` is evaluated in the server-rewrite phase, *before* the
#     location is chosen, so it would answer 403 for the http-01 challenge as
#     well — and that challenge arrives from Let's Encrypt, not from Cloudflare,
#     so refusing it breaks certificate renewal. Inside `location /` the check
#     runs after the location has been selected, so
#     `location ^~ /.well-known/acme-challenge/` still wins.
#     Measured: the same check at server level on :443 returns 403 for
#     `/.well-known/acme-challenge/` — that location never gets a chance.
#
#   * One block listening on both ports (share.tocli.cc is written this way) —
#     `location /` is the only option. Measured: a non-Cloudflare peer asking for
#     `/.well-known/acme-challenge/<probe>` gets 404 (the ACME location answered)
#     while `/healthz` gets 403.
#
# The check must look at $realip_remote_addr, not $remote_addr. The realip
# module runs in the post-read phase, before the access phase, so by the time
# anything like `allow`/`deny` evaluates, $remote_addr has already been
# rewritten to the visiting client — which is never a Cloudflare address. A list
# of Cloudflare ranges tested against $remote_addr would refuse everything.
# $realip_remote_addr is the peer the connection was actually accepted from,
# which is the thing worth testing.
#
# $agentshare_cf_peer is defined in /etc/nginx/conf.d/cloudflare-geo.conf, which
# update-cloudflare-ips.sh generates from Cloudflare's published ranges.
#
# ⚠️ Generate that file *before* installing any vhost that includes this one.
# nginx rejects a configuration that names an undefined variable, and a rejected
# `nginx -t` means no reload happens — so the bad file sits in /etc and the whole
# server's configuration becomes unable to change until someone notices. Test
# before you install, not after.
#
# Failure mode to recognise: if this ever starts refusing legitimate traffic,
# Cloudflare has probably added a range. Re-run update-cloudflare-ips.sh — the
# same fix as for the connection timeouts the firewall would otherwise produce,
# with the response code being the only difference.

if ($agentshare_cf_peer = 0) {
    return 403;
}
