# Proxy settings for an agentshare origin, shared by the :80 and :443 vhosts so
# the two cannot drift apart.
#
# Install to /etc/nginx/snippets/agentshare-proxy.conf and `include` it from
# every location that proxies to agentshare.

# A file service receives files. nginx's 1 MiB default would reject nearly all
# of them before the request ever reached agentshare — and it would do it with
# nginx's own error page, not with agentshare's JSON, so the caller would have
# no idea which limit it hit.
client_max_body_size 0;

# Stream the body straight through instead of spooling it to nginx's disk
# first. This halves the write amplification on a large upload, and a rejected
# upload fails immediately rather than after the client has sent everything.
proxy_request_buffering off;

# Transfers are allowed to be slow; a long upload from a bad link is a
# legitimate request, not a stuck one.
proxy_read_timeout 1h;
proxy_send_timeout 1h;
client_body_timeout 1h;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;

# $remote_addr, not $proxy_add_x_forwarded_for: when this origin sits behind
# Cloudflare, the realip module (see cloudflare-realip.conf) has already
# rewritten $remote_addr to the actual client. Appending to the incoming
# X-Forwarded-For instead would record the client twice.
proxy_set_header X-Forwarded-For   $remote_addr;

# The scheme the visitor actually used. Cloudflare connects to the origin on
# whichever scheme the visitor used, so this stays truthful — and agentshare
# builds its absolute URLs from AGENTSHARE_BASE_URL anyway, which is the
# authority on the public name.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
