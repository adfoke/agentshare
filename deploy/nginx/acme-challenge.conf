# The ACME http-01 challenge directory.
#
# `include` this from every server block, not just the :80 one. Let's Encrypt
# asks for the challenge over plain HTTP, so :80 alone would be enough today —
# but anything that arrives over HTTPS (a redirect, a client that prefers it,
# Cloudflare's "Always Use HTTPS") would fall through to `location /` and get
# the API's 404 instead. That failure is confusing precisely because the :80
# path works, which makes it look like the certificate is fine until the one
# moment it matters.
#
# The webroot lives outside the app so that issuing a certificate never depends
# on agentshare being up.

location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    # Never cached, never logged into the API: it is a challenge, not content.
    add_header Cache-Control "no-store" always;
}
