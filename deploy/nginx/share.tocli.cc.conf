# agentshare 的公开门面 —— 一台 **:443 已经被别人占着** 的机器。
#
# 源文件：仓库 deploy/nginx/share.tocli.cc.conf
# 安装到 /etc/nginx/sites-available/<你的域名> 并软链进 sites-enabled。
# （本目录的 vhost 只剩这一份；**:443 空着**那种形态的最小示例在 deploy/README.md 第二节，
#   snippet 完全共用。）
#
# 三处与"理想情况"不同，都是被这台机器上的既有服务逼出来的：
#
#   1. 回源口。443 是 xray(REALITY) 的，所以只能听 **8443**，靠 CF 的 Origin Rule
#      把 https 访客指过来：`(http.host eq "share.tocli.cc" and ssl)` → 源站 8443
#      （2026-10-16 已配好，ruleset version 6；配法与坑见 deploy/README.md §二「回源口」）。
#      ⚠️ 少了这条规则，CF 会照旧打 443 → 落到 xray 上 → REALITY 把未认证握手回落给
#      它的 `dest`（现为 amazon）→ **访客看到的是别人站点的 404 页**。
#      ⚠️ 只写 `and ssl` 那一条就够：多余的「一律 → 80」会把 https 访客也送回明文口
#      （2026-10-11 在 tomoon 上现场证明过）。
#
#   2. 证书。与既有四个站共用 /etc/nginx/ssl/tocli.cc-selfsigned.{crt,key}，
#      SAN 现在覆盖六个主机名（含 share.tocli.cc）。自签就够：zone 的 SSL 模式是
#      Full（非 strict），CF 到源站这一跳不校验证书。
#      ⚠️ 若改成 Full (strict)，必须换真证书，否则全站 526。
#
#   3. 默认 server。80 和 8443 都不是 default_server —— clash-sub 是。
#      所以带别的 Host（或裸 IP）打进来仍旧落回 clash-sub 的 404，
#      这个 vhost 只应答 share.tocli.cc。
#
# 依赖（都在本目录）：
#   snippets/agentshare-proxy.conf   代理设置（每条的原因写在该文件里）
#   snippets/cloudflare-guard.conf   只放行 CF 对端；用的是 $agentshare_cf_peer
#   snippets/acme-challenge.conf     证书挑战目录（换真证书时要用）
#   conf.d/00-agentshare-hardening.conf   log_format agentshare（把 /s/<token> 脱敏）
#   conf.d/cloudflare-{realip,geo}.conf   由 update-cloudflare-ips.sh 生成

server {
    listen      80;
    listen      [::]:80;
    # CF 的回源口（https 访客）。443 是 xray 的，不能监听。
    listen      8443 ssl;
    listen      [::]:8443 ssl;
    http2       on;

    server_name share.tocli.cc;

    ssl_certificate     /etc/nginx/ssl/tocli.cc-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/tocli.cc-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 分享链接是能力凭据 —— 这里选 hardening.conf 里那个把 /s/<token> 换成
    # /s/<redacted> 的 format，别用默认的 combined。
    access_log /var/log/nginx/share.access.log agentshare;
    error_log  /var/log/nginx/share.error.log;

    # 换真证书时（certbot --webroot -w /var/www/certbot）用得上。
    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        # 两个端口都挂 guard，但两条的理由不一样：
        #   · 80 —— ufw 里对全网开，这一层是**承重**的：没有它，任何人带个
        #     `Host: <这个域名>` 就能直连源站、绕开 CF 的 WAF/bot 规则/限速。
        #   · 8443 —— ufw 只放行 CF 的网段，所以目前属于纵深防御。但它是**共享回源口**
        #     （hyper / clash / mdview 也用这个口），哪天线放宽了，这层就是唯一的一道。
        #
        # 放在 `location /` 里而不是 server 级：server 级的 if 跑在 server-rewrite
        # 阶段、早于 location 匹配，会把上面那个 ACME 的 `location ^~` 一起 403 掉
        # （2026-10-16 在另一台机器的 :443 上实测过：非 CF 对端打
        #  /.well-known/acme-challenge/ 拿到的是 403）。放在这里，检查发生在选完
        #  location 之后，ACME 仍然优先命中 —— 实测非 CF 对端打同一个路径得到 404。
        include /etc/nginx/snippets/cloudflare-guard.conf;

        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/agentshare-proxy.conf;
    }
}
