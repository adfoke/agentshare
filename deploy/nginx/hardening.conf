# Request logging and response hardening for an origin behind Cloudflare.
#
# Install to /etc/nginx/conf.d/00-agentshare-hardening.conf. nginx.conf includes
# conf.d before sites-enabled, which matters: the log format defined here has to
# exist before the vhosts that name it are parsed.
#
# The vhosts then select it with `access_log /var/log/nginx/access.log agentshare;`.
# A server-level access_log replaces the http-level one rather than adding to it,
# so requests are logged once. Vhosts that do not select it — none today — would
# keep writing the default format to the same file.

# NOTE: version disclosure is NOT handled here. Ubuntu's stock nginx.conf ships
# `server_tokens build;` — which is why a stock box answers with
# "Server: nginx/1.28.3 (Ubuntu)" — and adding the directive again is a
# duplicate-directive error, not an override. Change that line in nginx.conf:
#
#   sed -i 's/^\tserver_tokens build;.*/\tserver_tokens off;/' /etc/nginx/nginx.conf
#
# (It is a conffile, so a package upgrade will ask about the local change. The
# distro's own comment on that line recommends turning it off.)

# A share link is a capability URL: whoever holds the token can download the file
# with no credential of their own. Writing one into an access log turns every
# later reader of that log — a shipper, a backup, a support session — into a
# holder of every link the service has ever handed out. The agent application
# redacts these in its own log for the same reason; this is the same treatment
# for the layer in front of it.
#
# The rest of the request line stays: method, path shape, status and size are
# what make an access log worth keeping.
map $uri $agentshare_loggable_uri {
    default  $uri;
    ~^/s/    /s/<redacted>;
}

# The query string is rebuilt through a map rather than written as
# `$is_args$args`. In a log_format nginx renders a variable whose value is NULL
# as "-", and $args is NULL rather than empty when a request has no query
# string — so the naive form produces '"GET /healthz- HTTP/1.1"'. Routing it
# through a map makes both cases a definite string: either "" or "?args".
map $args $agentshare_loggable_query {
    default  "?$args";
    ""       "";
}

log_format agentshare '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $agentshare_loggable_uri$agentshare_loggable_query $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# HSTS is one of the few headers a proxy to a plain-HTTP origin can set and the
# origin cannot: it belongs to the TLS layer, and here that is nginx. It is set
# at the http level so it covers both vhosts and both schemes — a browser only
# honours it over HTTPS, so sending it on the plain-HTTP redirect is harmless.
#
# No `preload` token. Preloading submits the domain to a list that is painful to
# leave if anything ever needs to be served over plain HTTP again, and that is a
# decision for the domain's owner rather than a side effect of a file service.
add_header Strict-Transport-Security "max-age=15552000" always;
